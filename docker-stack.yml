# Markdown Studio on a Docker Swarm of Raspberry Pis.
#
#   docker node update --label-add studio.data=true <the-pi-that-keeps-the-data>
#   mkdir -p /srv/markdown-studio/data /srv/markdown-studio/backups   # on that Pi
#   docker stack deploy -c docker-stack.yml studio
#
# SQLite wants exactly one writer on a local disk, so the app runs as a single
# replica pinned to the labelled node, with its data in a bind mount there.
# Swarm's routing mesh still answers on PORT from every node in the cluster,
# and if the app crashes Swarm restarts it on the same node. Never put the
# database on NFS/SMB: SQLite's locking is not safe over network filesystems.
services:
  markdown-studio:
    image: ghcr.io/kevinmcaleer/markdown-studio:${STUDIO_TAG:-latest}
    init: true
    environment:
      DATABASE_PATH: /data/studio.db
      PORT: "8000"
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      HTTPS: ${HTTPS:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - target: 8000
        published: ${PORT:-8000}
    volumes:
      - type: bind
        source: ${STUDIO_DATA_DIR:-/srv/markdown-studio}/data
        target: /data
      - type: bind
        source: ${STUDIO_DATA_DIR:-/srv/markdown-studio}/backups
        target: /backups
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.studio.data == true
      update_config:
        # Stop the old container before starting the new one: two copies must
        # never write the same SQLite file at once.
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 512M

  # Optional Cloudflare Tunnel: uncomment to publish the suite through
  # Cloudflare with no open ports. Two replicas on different Pis keep it up
  # if one node goes down; they reach the app over the overlay network.
  # cloudflared:
