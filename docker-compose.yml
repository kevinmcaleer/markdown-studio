# Markdown Studio on one machine (a single Raspberry Pi is fine).
# For a cluster of Pis, see docker-stack.yml and "Raspberry Pi cluster" in README.md.
services:
  markdown-studio:
    build: .
    image: ghcr.io/kevinmcaleer/markdown-studio:${STUDIO_TAG:-latest}
    restart: unless-stopped
    init: true  # reap zombies and forward signals cleanly
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/studio.db
      PORT: ${PORT:-8000}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8000}:${PORT:-8000}"
    volumes:
      # The SQLite database (and every file stored in it) lives here on the host.
      - ./data:/data
      - ./backups:/backups
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request,sys; sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"PORT\",\"8000\")}/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Grammar checking for Notes. Only starts with COMPOSE_PROFILES=language;
  # then set LANGUAGETOOL_URL=http://languagetool:8010 in .env.
  languagetool:
    image: erikvl87/languagetool:latest
    profiles: [language]
    restart: unless-stopped
    environment:
      Java_Xms: 256m
      Java_Xmx: 1g

  # Translate for Notes. Only starts with COMPOSE_PROFILES=language; then set
  # LIBRETRANSLATE_URL=http://libretranslate:5000 in .env. Its models are kept
  # in a volume so they download once.
  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: [language]
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,fr,es,de}
    volumes:
      - libretranslate-models:/home/libretranslate/.local

  # Cloudflare Tunnel: publishes the suite at your hostname (e.g.
  # studio.kevspowertools.com) without opening any ports on this machine.
  # Only starts when COMPOSE_PROFILES=tunnel is set in .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      markdown-studio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  libretranslate-models:
