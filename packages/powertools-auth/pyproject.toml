[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "powertools-auth"
version = "0.1.0"
description = "Shared login for Kev's Power Tools apps: accounts, server-side sessions, CSRF and rate limiting on SQLite + FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.150",
    "argon2-cffi>=25.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
powertools_auth = ["migrations/*.sql"]
