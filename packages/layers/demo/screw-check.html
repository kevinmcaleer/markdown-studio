<!doctype html>
<html><head><meta charset="utf-8"><title>screw check</title></head>
<body style="margin:0">
<script type="module">
  import "../src/layers.css";
  import { openWorkspace } from "../src/scene/workspace.ts";
  import { ModelStore } from "../src/scene/render.ts";
  const store = new ModelStore(async url => (await fetch(url)).arrayBuffer());
  const scene = { version: 1, parts: [{ id: "p1", name: "Bracket plate", url: "/tmp-meshes/bracket_plate.stl", position: [0,0,3], rotation: [0,0,0] }],
    camera: { direction: [1,-1,0.82], target: [0,0,0], size: 30 }, style: { preset: "line-art", fill: "#ffffff", line: "#111111", lineWidth: 1, outline: 3, crease: 30, highlight: "#9db8f5", ghost: "#a6a6a6" }, explode: 0 };
  window.result = null;
  openWorkspace({ scene, width: 800, height: 600, scale: 2, background: "#ececec", store }).then(r => { window.result = r; });
</script>
</body></html>
