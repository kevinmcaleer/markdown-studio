# Tooling for the Python server (server/studio) and the shared auth package.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = [
    "S101",  # assert is fine in tests
    "S608",  # SQL built only from fixed column names; values are parameterised
    "B008",  # FastAPI's Depends() in defaults is idiomatic
    "S311",
]

[tool.ruff.lint.isort]
known-first-party = ["studio", "powertools_auth"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S105", "S106", "S603", "S607", "E501"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "packages/powertools-auth/tests"]
pythonpath = ["server", "server/tests"]
addopts = "-q --import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.coverage.run]
source = ["server/studio", "packages/powertools-auth/src/powertools_auth"]
omit = ["server/studio/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
